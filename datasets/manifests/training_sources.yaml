    ref: usharengaraju/isaid-dataset
    approx_gb: 6.9
    license: CC-BY-NC-4.0
  - name: spacenet7_multitemporal
    task: building_change
    source: kaggle
    ref: amerii/spacenet-7-multitemporal-urban-development
    approx_gb: 11.1
    license: CC-BY-NC-SA-4.0
  - name: cloud95_landsat8
    task: cloud_segmentation
    source: kaggle
    ref: sorour/95cloud-cloud-segmentation-on-satellite-images
    approx_gb: 15.2
    license: CC0
  - name: masati_v2_ships
    task: ship_detection
    source: kaggle
    ref: louisaberdeen/masati-v2
    approx_gb: 3.5
    license: "see Kaggle description (MASATI-v2 terms)"
