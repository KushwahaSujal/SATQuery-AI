services:
  postgres:
    image: postgres:16-alpine
    container_name: satquery-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satquery}
      POSTGRES_DB: ${POSTGRES_DB:-satquery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-satquery} -d $${POSTGRES_DB:-satquery}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - satquery-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: satquery-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - SATQUERY_ENV=${SATQUERY_ENV:-production}
      - SATQUERY_DEVICE=${SATQUERY_DEVICE:-auto}
      - SATQUERY_RESULTS_DIR=/app/results
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-satquery}:${POSTGRES_PASSWORD:-satquery}@postgres:5432/${POSTGRES_DB:-satquery}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-satquery}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-satquery}
      - POSTGRES_DB=${POSTGRES_DB:-satquery}
      - CHECKPOINT_ROOT=/app/checkpoints
      - DATA_ROOT=/app/datasets
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./results:/app/results:rw
      - ./configs:/app/configs:ro
      - ./datasets:/app/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - satquery-net
    # Optional NVIDIA GPU passthrough (Requires NVIDIA Container Toolkit on host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - satquery-net

networks:
  satquery-net:
    driver: bridge

volumes:
  postgres_data:
    name: satquery_postgres_data
