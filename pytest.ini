[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto

markers =
    unit: pure logic — no model weights, no database, no network. Runs in seconds.
    integration: database, API client and cross-module wiring. Uses SQLite + mocks.
    models: requires real model weights on disk or from HuggingFace. Slow.

# Markers are applied automatically by directory in tests/conftest.py, so a test
# only needs an explicit marker when it does not match its directory's tier.
#
#   pytest -m unit                 fast feedback while developing
#   pytest -m "not models"         everything runnable without checkpoints
#   pytest                         the lot
