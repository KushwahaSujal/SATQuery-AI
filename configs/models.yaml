device:
  preferred: "auto"  # auto | cuda | mps | cpu
  fallback: "cpu"
  allow_cpu_for_heavy_models: true

concurrency:
  gpu_lock_timeout_seconds: 120

models:
  general_rs_vlm:
    name: "GeneralRSVLM"
    version: "v1.0"
    task: "vqa"
    supported_tasks:
      - "single_image_vqa"
      - "single_image_caption"
    supported_modalities:
      - "optical"
      - "multispectral"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/general_rs_vlm"
    device: "auto"
    precision: "float16"

  scene_vlm:
    name: "SceneVLM"
    version: "qwen3-vl-4b-instruct-nf4"
    task: "vqa"
    supported_tasks:
      - "single_image_vqa"
      - "single_image_caption"
    supported_modalities:
      - "optical"
      - "multispectral"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/scene_vlm_qwen3vl4b_nf4"
    model_id: "Qwen/Qwen3-VL-4B-Instruct"
    device: "auto"
    precision: "float16"

  grounding_dino:
    name: "GroundingDINO"
    version: "T-v1.0"
    task: "grounding"
    supported_tasks:
      - "single_image_grounding"
    supported_modalities:
      - "optical"
      - "multispectral"
      - "sar"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/grounding_dino/groundingdino_swint_ogc.pth"
    config_path: "checkpoints/grounding_dino/GroundingDINO_SwinT_OGC.py"
    device: "auto"
    model_id: "IDEA-Research/grounding-dino-base"
    box_threshold: 0.35
    text_threshold: 0.25

  sam2:
    name: "SAM2"
    version: "Hiera-Base"
    task: "segmentation"
    supported_tasks:
      - "single_image_segmentation"
      - "grounding_refinement"
    supported_modalities:
      - "optical"
      - "multispectral"
      - "sar"
    input_count: 1
    input_relationship: "single"
    enabled: true
    model_id: "facebook/sam2.1-hiera-small"
    checkpoint_path: "checkpoints/sam2/sam2_hiera_base_plus.pt"
    config_path: "checkpoints/sam2/sam2_hiera_b+.yaml"
    device: "auto"

  changeformer:
    name: "ChangeFormer"
    version: "v6"
    task: "change_detection"
    supported_tasks:
      - "bi_temporal_change"
      - "bi_temporal_change_vqa"
    supported_modalities:
      - "optical"
      - "multispectral"
    input_count: 2
    input_relationship: "temporal"
    enabled: true
    checkpoint_path: "checkpoints/changeformer/changeformer_v6_levir_levircd256_epoch20_best.pt"
    # Frozen on LEVIR-CD validation, never tuned on test (docs/models/changeformer/reports/frozen_validation_threshold.json).
    threshold: 0.435
    # Scenes up to this side run in one native pass; larger ones are windowed at this size.
    max_native_side: 1024
    device: "auto"

  cdvqa:
    name: "CDVQA"
    version: "v1.0"
    task: "change_vqa"
    supported_tasks:
      - "bi_temporal_change_vqa"
    supported_modalities:
      - "optical"
      - "multispectral"
    input_count: 2
    input_relationship: "temporal"
    enabled: true
    checkpoint_path: "checkpoints/cdvqa/cdvqa_satquery.pt"
    device: "auto"

  dofa:
    name: "DOFA"
    version: "ViT-Base-e100"
    task: "representation"
    supported_tasks:
      - "optical_sar_analysis"
      - "feature_extraction"
    supported_modalities:
      - "optical"
      - "multispectral"
      - "sar"
    input_count: 2
    input_relationship: "cross_modal"
    enabled: true
    checkpoint_path: "checkpoints/dofa/DOFA_ViT_base_e100.pth"
    device: "auto"

  satquery_optical_sar_fusion:
    name: "OpticalSARFusionModel"
    version: "v1.0"
    task: "fusion_prediction"
    supported_tasks:
      - "optical_sar_analysis"
      - "multimodal_fusion"
      - "cross_modal_analysis"
    supported_modalities:
      - "optical"
      - "sar"
    input_count: 2
    input_relationship: "cross_modal"
    enabled: true
    checkpoint_path: "checkpoints/optical_sar/satquery_fusion.pth"
    device: "auto"

  remoteclip:
    name: "RemoteCLIP"
    version: "ViT-B-32"
    task: "image_text"
    supported_tasks:
      - "zero_shot_classification"
      - "cross_modal_retrieval"
    supported_modalities:
      - "optical"
      - "multispectral"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/remoteclip/RemoteCLIP-ViT-B-32.pt"
    device: "auto"

  # ------------------------------------------------------------------ locally trained models
  # Trained on tiles resampled to 0.5 m (training/segmentation/datasets.py, TARGET_GSD_M).
  # Registered and enabled, but nothing routes to them yet: see docs/models/trained_segmenters.md
  # and project/qna.md Q-031.
  roads_segmenter:
    name: "RoadSegmenter"
    version: "roads_all_r50"
    task: "segmentation"
    supported_tasks:
      - "single_image_segmentation"
    supported_modalities:
      - "optical"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/roads_all_r50_seg/best.pt"
    class_name: "road"
    # Left unset so the threshold frozen on validation inside the checkpoint (0.35) is used.
    threshold: null
    # 4-flip averaging: +0.012 test IoU on DeepGlobe, 4x slower (Q-032).
    tta: false
    device: "auto"

  buildings_segmenter:
    name: "BuildingSegmenter"
    version: "buildings_whu_ma_r50"
    task: "segmentation"
    supported_tasks:
      - "single_image_segmentation"
    supported_modalities:
      - "optical"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/buildings_whu_ma_r50_seg/best.pt"
    class_name: "building"
    threshold: null  # checkpoint threshold: 0.45
    tta: false
    device: "auto"

  landcover_segmenter:
    name: "LandCoverSegmenter"
    version: "landcover_dg_lv_oem"
    task: "land_cover_segmentation"
    supported_tasks:
      - "single_image_segmentation"
      - "land_cover_mapping"
    supported_modalities:
      - "optical"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/landcover_dg_lv_oem_seg/best.pt"
    device: "auto"

  crater_detector:
    name: "CraterDetector"
    version: "yolo11s-craters"
    task: "detection"
    supported_tasks:
      - "single_image_detection"
    supported_modalities:
      - "optical"
    input_count: 1
    input_relationship: "single"
    enabled: true
    checkpoint_path: "checkpoints/craters_yolo/weights/best.pt"
    # Trained at 832 px; ultralytics confidence threshold for serving.
    input_size: 832
    box_threshold: 0.25
    device: "auto"

  bigearthnet:
    name: "BigEarthNet-v2.0"
    version: "resnet50-all-v0.2.0"
    task: "multimodal_classification"
    supported_tasks:
      - "multimodal_land_cover"
      - "optical_sar_analysis"
    supported_modalities:
      - "optical"
      - "multispectral"
      - "sar"
    input_count: 2
    input_relationship: "cross_modal"
    enabled: true
    checkpoint_path: "checkpoints/bigearthnet/model.safetensors"
    config_path: "checkpoints/bigearthnet/config.json"
    device: "auto"
