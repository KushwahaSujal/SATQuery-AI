app:
  name: "SatQuery AI"
  version: "1.0.0"
  environment: "development"
  debug: true
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

storage:
  results_dir: "results"
  max_upload_size_mb: 500
  allowed_extensions:
    - ".tif"
    - ".tiff"
    - ".png"
    - ".jpg"
    - ".jpeg"

geospatial:
  tiling:
    tile_size: 512
    overlap: 64
    max_dimension_no_tile: 2048
  display:
    percentile_min: 2.0
    percentile_max: 98.0
    preview_max_dim: 1024
  co_registration:
    max_resolution_diff_ratio: 0.1
    min_bounds_iou: 0.8
  metric_projection_fallback: "EPSG:3857"

logging:
  level: "INFO"
  structured_json: true

# Second-agent verification: RemoteCLIP independently checks each Grounding DINO candidate.
# Measured on 973 VRSBench GT crops at these settings (results/evaluations/detection_verifier_3way_20260914.json):
#   true label → verified 80.7% / contradicted 13.2%;  wrong label → verified 6.3% / contradicted 84.2%.
agent_verification:
  enabled: true
  top_k: 3
  crop_pad: 1.0
  min_crop_side: 96
  # Video: an event is kept only if at least one of this many of its detections is VERIFIED.
  video_frames_to_verify: 3
  # Best-match labels that are scene context, not objects: losing to these means UNVERIFIED, not CONTRADICTED.
  context_labels: [road, trees, building, water, bare land, parking lot, grass field]
  max_candidates: 5
  relaxed_box_threshold: 0.15
  prompt_template: "a satellite photo of a {label}"
  vocabulary: [airplane, airport, baseball diamond, basketball court, bridge, chimney,
               container crane, dam, expressway service area, expressway toll station,
               golffield, ground track field, harbor, helicopter, overpass, roundabout, ship,
               soccer ball field, stadium, storage tank, swimming pool, tennis court,
               trainstation, vehicle, windmill, road, trees, building, water, bare land,
               parking lot, grass field]
  synonyms:
    - [vehicle, car, cars, vehicles, truck, bus, van, taxi]
    - [airplane, plane, aircraft, jet, airplanes, planes]
    - [ship, boat, vessel, ships, boats]
    - [building, house, warehouse, buildings, houses, roof, structure]
    - [storage tank, tank, oil tank, storage tanks]
    - [swimming pool, pool]
    - [road, street, highway, roads]
    - [trees, tree, forest, vegetation]
    - [water, river, lake, pond]
    - [helicopter, helicopters]
    - [bridge, bridges]

# Direct trained-segmenter dispatch for plain "mark all roads" / "segment buildings" style queries
# (project/qna.md Q-025t, Q-026t, Q-038). Env override: SATQUERY_TRAINED_SEGMENTERS_ENABLED.
trained_segmenter_routing:
  enabled: true

# ChangeFormer vs CDVQA adjudication (project/qna.md Q-012).
change_adjudication:
  # ChangeFormer building-change ratio treated as "buildings changed". On the 1,113 no-change LEVIR-CD test
  # pairs, 2.1% of predictions exceed 1.0% (a false claim); 0.1% is exceeded by 5.9%.
  building_change_present_ratio: 0.01
  # Below this, "no building change". 1.7% of real-change LEVIR-CD pairs have a true ratio below 0.1%.
  building_change_absent_ratio: 0.001
  # ChangeFormer precision on the full LEVIR-CD test split through the production adapter (Q-007).
  changeformer_precision: 0.8656
  # CDVQA accuracy per question type, SECOND-CDVQA test split (2,000 samples), docs/models/CDVQA.md §18.
  cdvqa_accuracy_by_question_type:
    change_or_not: 0.8357
    increase_or_not: 0.7727
    decrease_or_not: 0.7554
    change_ratio_types: 0.7000
    change_to_what: 0.6054
    largest_change: 0.4694
    change_ratio: 0.3776
    smallest_change: 0.3129
